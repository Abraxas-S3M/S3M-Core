[pytest]
# Edge and API test selection for PR CI (`-m "not gpu and not slow"`).
markers =
    gpu: requires PyTorch and a CUDA-capable device (excluded from PR security-core job)
    slow: long-running or integration tests; performance tests that may take several seconds on CI hardware
    cortex: Cortex reasoning-brain security and policy tests
    range: live-range or hardware-in-the-loop checks (never run in default CI)
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
testpaths =
    tests
    s3m_core/tests
pythonpath =
    .
filterwarnings =
    ignore::DeprecationWarning
