[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "s3m-core"
version = "0.0.0"
description = "S3M sovereign military AI core"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "services*", "packages*", "s3m_core*", "apps*"]
