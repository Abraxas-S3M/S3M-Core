# S3M engine registry — single source of truth for Cortex council roles and quad-engine bindings.
# Tactical context: mission planners admit models here before they may load on edge nodes.

cortex_council:
  strategist: strategist_core
  sentinel: sentinel
  challenger: challenger
  interpreter: interpreter
  engineer: engineer
  extractor: extractor

quad_engine_map:
  tactical_engine: extractor
  reasoning_engine: sentinel
  planning_engine: mistral
  arabic_engine: interpreter

engines:
  strategist_core:
    name: "Strategist Core (1T-class MoE)"
    provider: "open-weight"
    family: "moe-open"
    parameters: "1T-class (MoE)"
    tier: core
    runtime: vllm
    license: "Apache-2.0"
    domain: reasoning
    context_window: 32768
    max_tokens: 4096
    council_role: strategist
    manifest_id: strategist_core
    model_file: ""
    tools_enabled: true
    admission:
      status: quarantine
      format: safetensors
      sha256_verified: false
      pinned_sha256: ""
      scanner_passed: false
      evals_passed: false

  sentinel:
    name: "Phi-3 Medium"
    alt_candidates:
      - name: "Ministral 3 14B"
        license: "Apache-2.0"
    provider: "Microsoft"
    family: "Phi-3"
    parameters: "14B"
    tier: all
    runtime: gguf
    license: "MIT"
    domain: tactical
    context_window: 4096
    max_tokens: 1024
    quantization: Q4_K_M
    council_role: sentinel
    manifest_id: phi3_medium
    model_file: phi-3-medium-4k-instruct-q4_k_m.gguf
    local_path: models/phi3-medium/phi-3-medium-4k-instruct.Q4_K_M.gguf
    tools_enabled: true

  challenger:
    name: "Challenger (non-Mistral)"
    provider: TBD
    family: TBD
    parameters: TBD
    tier: regional
    runtime: gguf
    license: TBD
    domain: reasoning
    council_role: challenger
    manifest_id: challenger
    model_file: ""
    tools_enabled: true
    admission:
      status: not_selected

  interpreter:
    name: "ALLaM-7B"
    provider: "SDAIA"
    family: "ALLaM"
    parameters: "7B"
    tier: regional
    runtime: gguf
    license: "SDAIA"
    domain: arabic_nlp
    context_window: 4096
    max_tokens: 1024
    quantization: Q4_K_M
    council_role: interpreter
    manifest_id: allam_7b
    model_file: allam-7b-instruct-q4_k_m.gguf
    local_path: models/allam/allam-7b-instruct.Q4_K_M.gguf
    tools_enabled: true

  engineer:
    name: "Devstral Small 2 24B"
    provider: "Mistral AI"
    family: "Devstral"
    parameters: "24B"
    tier:
      - core
      - regional
    runtime: gguf
    license: "Apache-2.0"
    domain: planning
    context_window: 32768
    max_tokens: 2048
    council_role: engineer
    manifest_id: devstral_small_2
    model_file: devstral-small-2-24b-q4_k_m.gguf
    tools_enabled: true

  extractor:
    name: "Phi-3 mini"
    provider: "Microsoft"
    family: "Phi-3"
    parameters: "3.8B"
    tier: edge
    runtime: gguf
    license: "MIT"
    domain: tactical
    context_window: 4096
    max_tokens: 512
    quantization: Q4_K_M
    council_role: extractor
    manifest_id: phi3_mini
    model_file: phi-3-mini-4k-instruct-q4_k_m.gguf
    local_path: models/phi3/phi-3-mini-4k-instruct-q4_k_m.gguf
    tools_enabled: false

  phi3:
    name: "Phi-3 Medium"
    provider: "Microsoft"
    parameters: "14B"
    quantization: Q4_K_M
    runtime: gguf
    tier: core
    family: "Phi-3"
    license: "MIT"
    source: huggingface
    hf_repo: microsoft/Phi-3-medium-4k-instruct
    hf_repo_gguf: bartowski/Phi-3-medium-4k-instruct-GGUF
    gcs_bucket: gs://s3m-weight-vault/phi3-medium/
    domain: tactical
    context_window: 4096
    max_tokens: 1024
    fp16_size_gb: 28
    q4_size_gb: 8.5
    manifest_id: phi3_medium
    model_file: phi-3-medium-4k-instruct-q4_k_m.gguf
    alias_of: sentinel

  grok1:
    name: "Grok-1"
    provider: "xAI"
    parameters: "314B (MoE, 8 experts)"
    quantization: Q4_K_M
    runtime: gguf
    tier: core
    family: "Grok"
    license: "custom"
    source: huggingface+torrent
    hf_repo: xai-org/grok-1
    github_repo: https://github.com/xai-org/grok-1
    gcs_bucket: gs://s3m-weight-vault/grok1/
    domain: reasoning
    context_window: 8192
    max_tokens: 2048
    fp16_size_gb: 300
    q4_size_gb: 80
    moe_experts: 8
    active_experts_per_token: 2
    manifest_id: grok_8b
    model_file: grok1-q4_k_m.gguf
    status: retired
    retired_reason: superseded by strategist_core

  mistral_large_4:
    name: "Mistral Large 4 (Le Chonk)"
    provider: "Mistral AI"
    family: "Mistral Large"
    parameters: "1T-class MoE"
    quantization: FP8
    runtime: vllm
    tier: core
    license: "Apache-2.0"
    domain: planning
    context_window: 32768
    max_tokens: 2048
    manifest_id: mistral_large_4
    model_file: ""
    tools_enabled: false
    status: quarantine
    admission:
      status: quarantine
      format: safetensors
      sha256_verified: false
      pinned_sha256: ""
      scanner_passed: false
      evals_passed: false
      signature: ""
      require_shard_inventory: true
    lechonk:
      deployment_profiles:
        - fp8_gpu
        - nvfp4_blackwell_gpu
        - cpu_gguf_experimental
        - fallback_small_model
      private_vllm:
        base_url_env: S3M_LECHONK_VLLM_BASE_URL
        model_name: mistral-large-4
        max_concurrent_requests: 2
        request_timeout_s: 120

  mistral:
    name: "Mixtral 8x7B"
    provider: "Mistral AI"
    parameters: "46.7B effective (MoE, 8x7B)"
    quantization: Q4_K_M
    runtime: gguf
    tier: regional
    family: "Mistral"
    license: "Apache-2.0"
    source: huggingface
    hf_repo: mistralai/Mixtral-8x7B-Instruct-v0.1
    hf_repo_gguf: TheBloke/Mixtral-8x7B-Instruct-v0.1-GGUF
    gcs_bucket: gs://s3m-weight-vault/mixtral/
    domain: planning
    context_window: 32768
    max_tokens: 2048
    fp16_size_gb: 93
    q4_size_gb: 26
    moe_experts: 8
    active_experts_per_token: 2
    optional_regional_fallback: true
    manifest_id: mistral_7b
    model_file: mixtral-8x7b-instruct-v0.1-q4_k_m.gguf
    local_path: models/mixtral/mixtral-8x7b-instruct-v0.1.Q4_K_M.gguf

  allam:
    name: "ALLaM-7B"
    provider: "SDAIA"
    parameters: "7B"
    quantization: Q4_K_M
    runtime: gguf
    tier: regional
    family: "ALLaM"
    license: "SDAIA"
    source: huggingface
    hf_repo: humain-ai/ALLaM-7B-Instruct-preview
    gcs_bucket: gs://s3m-weight-vault/allam/
    local_path: models/allam/allam-7b-instruct.Q4_K_M.gguf
    domain: arabic_nlp
    context_window: 4096
    max_tokens: 1024
    fp16_size_gb: 14
    q4_size_gb: 4
    manifest_id: allam_7b
    model_file: allam-7b-instruct-q4_k_m.gguf
    alias_of: interpreter

manifest_aliases:
  phi3-mini: phi3_mini
  phi3-medium: phi3_medium
  mistral-7b: mistral_7b
  mixtral-8x7b: mistral_7b
  grok-8b: grok_8b
  grok1: grok_8b
  allam-7b: allam_7b

weight_vault:
  primary: local_server
  local_server:
    path: /mnt/s3m-weights/
    capacity_tb: 4
    expandable_to_tb: 10
    sync_method: rsync+ssh
  cloud_backup:
    provider: google_cloud_storage
    bucket: s3m-weight-vault
    region: me-central1
  sync_strategy: local-primary-cloud-backup
  total_fp16_budget_gb: 435
  total_q4_budget_gb: 119
